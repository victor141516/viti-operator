<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Viti Operator topology</title>
  <link rel="stylesheet" href="/topology-viewer.css">
</head>
<body>
  <main class="viewer-shell">
    <header class="viewer-toolbar">
      <div class="viewer-live" id="viewer-live" aria-live="polite"><i></i><span>Connecting…</span></div>
    </header>
    <section class="map-viewport" id="map-viewport" tabindex="0" aria-label="Interactive connection map. Drag to pan, and pinch or use the mouse wheel to zoom.">
      <div class="map-stage" id="map-stage">
        <svg class="map-links" id="map-links" aria-hidden="true"></svg>
        <div class="map-content" id="map-content"></div>
      </div>
      <div class="map-help">Drag to pan · Pinch or use the wheel to zoom</div>
      <aside class="map-popover" id="map-popover" role="tooltip" aria-live="polite" hidden></aside>
    </section>
    <aside class="viewer-insight" id="viewer-insight" aria-live="polite"></aside>
    <div class="viewer-legend" aria-label="Legend">
      <span><i class="healthy"></i>Operational</span>
      <span><i class="peer"></i>Connected</span>
      <span><i class="idle"></i>Inactive</span>
      <span><i class="warning"></i>Retrying</span>
      <span><i class="failed"></i>Problem</span>
    </div>
  </main>
  <script src="/topology-viewer.js"></script>
</body>
</html>
