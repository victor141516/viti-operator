charon {
  load_modular = no
  load = random nonce openssl aes sha1 sha2 hmac kdf fips-prf pubkey x509 pem constraints kernel-libipsec kernel-netlink socket-default vici eap-identity eap-aka eap-aka-broker
  make_before_break = yes
  install_virtual_ip = yes
  install_virtual_ip_on = ipsec0

  filelog {
    stdout {
      default = 2
      ike = 2
      cfg = 2
      knl = 2
      flush_line = yes
    }
  }

  plugins {
    kernel-libipsec {
      raw_esp = no
    }
  }
}
