[global]
type=global
user_agent=Viti isolated native voice lab
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
[native-lab]
type=endpoint
context=native-lab
transport=transport-ws
auth=native-lab-auth
aors=native-lab
disallow=all
allow=ulaw,alaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
dtmf_mode=rfc4733
[native-lab-auth]
type=auth
auth_type=userpass
username=native-lab
password=native-lab-only
[native-lab]
type=aor
max_contacts=2
remove_existing=yes
minimum_expiration=10
maximum_expiration=30
