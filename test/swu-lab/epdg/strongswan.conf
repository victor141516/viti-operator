charon {
  load_modular = no
  load = random nonce openssl aes sha1 sha2 hmac kdf fips-prf pubkey x509 pem constraints kernel-libipsec kernel-netlink socket-default vici eap-identity eap-aka eap-aka-3gpp p-cscf

  filelog {
    stdout {
      default = 2
      ike = 2
      cfg = 2
      knl = 2
      flush_line = yes
    }
  }
}
