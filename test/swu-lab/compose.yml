name: viti-swu-lab

services:
  epdg:
    build:
      context: ../..
      dockerfile: test/swu-lab/epdg.Dockerfile
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      operator:
        ipv4_address: 172.30.40.10

  nat-gateway:
    build:
      context: ../..
      dockerfile: test/swu-lab/nat-gateway.Dockerfile
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "1"
    healthcheck:
      test: ["CMD", "test", "-f", "/run/nat-ready"]
      interval: 1s
      timeout: 1s
      retries: 10
    networks:
      outer:
        ipv4_address: 172.30.39.254
      operator:
        ipv4_address: 172.30.40.254

  aka-broker:
    build:
      context: ../..
      dockerfile: test/swu-lab/tools.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/aka_broker.py"]
    environment:
      LAB_AKA_K: 465B5CE8B199B49FAA5F0A2EE238A6BC
      LAB_AKA_OPC: E8ED289DEBA952E4283B54E88E6183CA
    networks: [outer]

  strongswan-backend:
    image: ${LAB_STRONGSWAN_BACKEND_IMAGE:-viti-swu-lab-strongswan-backend}
    build:
      context: ../..
      dockerfile: test/swu-lab/strongswan-backend.Dockerfile
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -n "$${LAB_NAT_GATEWAY:-}" ]; then
          ip route replace "$${SWU_EPDG}/32" via "$${LAB_NAT_GATEWAY}"
        fi
        exec python3 /usr/local/bin/strongswan_adapter.py
    depends_on:
      epdg:
        condition: service_started
      aka-broker:
        condition: service_started
      nat-gateway:
        condition: service_healthy
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SWU_SOURCE: 172.30.39.20
      SWU_EPDG: 172.30.40.10
      LAB_NAT_GATEWAY: 172.30.39.254
      SWU_APN: ims
      USIM_IMSI: "001010123456789"
      SWU_MCC: "001"
      SWU_MNC: "001"
      SWU_HTTP_AKA_URL: http://aka-broker:8080/authenticate
      SWU_HTTP_AKA_TOKEN: lab-token
      SWU_HTTP_AKA_TIMEOUT: "1"
      SWU_TUN_MTU: "1400"
      SWU_LIVENESS_PERIOD: "${LAB_SWU_LIVENESS_PERIOD:-20}"
      SWU_NATT_KEEPALIVE: "${LAB_SWU_NATT_KEEPALIVE:-20}"
      SWU_CHILD_REKEY_MINUTES: "${LAB_SWU_CHILD_REKEY_MINUTES:-30}"
      SWU_IKE_REKEY_MINUTES: "${LAB_SWU_IKE_REKEY_MINUTES:-45}"
      SWU_REDACT_SECRETS: "1"
      VOWIFI_RUNDIR: /run/vowifi
      VITI_EVENT_OUTBOX_DIR: /run/vowifi/event-outbox
    volumes:
      - strongswan-runtime:/run/vowifi
    networks:
      outer:
        ipv4_address: 172.30.39.20

  strongswan-probe:
    image: viti-swu-lab-strongswan-probe
    build:
      context: ../..
      dockerfile: test/swu-lab/strongswan-backend.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    depends_on: [strongswan-backend]
    network_mode: service:strongswan-backend
    cap_add: [NET_ADMIN]
    environment:
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
    volumes:
      - strongswan-runtime:/run/vowifi:ro

  strongswan-lifecycle-probe:
    build:
      context: ../..
      dockerfile: test/swu-lab/strongswan-backend.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    network_mode: none
    environment:
      LAB_PROBE_MODE: lifecycle
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
    volumes:
      - strongswan-runtime:/run/vowifi:ro

  strongswan-failure-probe:
    build:
      context: ../..
      dockerfile: test/swu-lab/strongswan-backend.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    network_mode: none
    environment:
      LAB_PROBE_MODE: failed_attach
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
    volumes:
      - strongswan-runtime:/run/vowifi:ro

  strongswan-terminated-probe:
    build:
      context: ../..
      dockerfile: test/swu-lab/strongswan-backend.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    network_mode: none
    environment:
      LAB_PROBE_MODE: terminated
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
    volumes:
      - strongswan-runtime:/run/vowifi:ro

  # Opt-in packaged-image check.  The lab normally replaces the engine
  # entrypoint to isolate protocol behavior; this service verifies that Docker
  # SIGTERM reaches the real production supervisor and durably records down.
  engine-entrypoint:
    profiles: [entrypoint]
    image: ${LAB_ENGINE_IMAGE:-viti-operator-engine:entrypoint-test}
    entrypoint:
      - /bin/sh
      - -c
      - |
        ip route replace 172.30.40.10/32 via 172.30.39.254
        exec /entrypoint.sh
    depends_on:
      epdg:
        condition: service_started
      aka-broker:
        condition: service_started
      nat-gateway:
        condition: service_healthy
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    stop_grace_period: 20s
    environment:
      SWU_HTTP_AKA_URL: http://aka-broker:8080/authenticate
      SWU_HTTP_AKA_TOKEN: lab-token
      SWU_HTTP_AKA_TIMEOUT: "1"
      VOWIFI_AMI_SECRET: lab-ami-secret
      VOWIFI_VOICE_PASSWORD: lab-voice-password
      VOWIFI_RUNDIR: /run/vowifi
      VITI_EVENT_OUTBOX_DIR: /run/vowifi/event-outbox
    volumes:
      - ./engine-instance.json:/config/instance.json:ro
      - engine-entrypoint-runtime:/run/vowifi
    networks:
      outer:
        ipv4_address: 172.30.39.21

  engine-entrypoint-terminated-probe:
    profiles: [entrypoint]
    build:
      context: ../..
      dockerfile: test/swu-lab/tools.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    network_mode: none
    environment:
      LAB_PROBE_MODE: terminated
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
    volumes:
      - engine-entrypoint-runtime:/run/vowifi:ro

  engine-entrypoint-probe:
    profiles: [entrypoint]
    build:
      context: ../..
      dockerfile: test/swu-lab/tools.Dockerfile
    entrypoint: ["python3", "/opt/swu-lab/lab_probe.py"]
    network_mode: service:engine-entrypoint
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      engine-entrypoint:
        condition: service_started
    environment:
      PYTHONPATH: /usr/local/bin
      VOWIFI_RUNDIR: /run/vowifi
      LAB_EPDG: 172.30.40.10
    volumes:
      - engine-entrypoint-runtime:/run/vowifi:ro

networks:
  outer:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.39.0/24
  operator:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.40.0/24

volumes:
  strongswan-runtime:
  engine-entrypoint-runtime:
